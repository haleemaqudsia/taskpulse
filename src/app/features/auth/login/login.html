<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="bg-white shadow-xl rounded-2xl p-6 sm:p-10 w-full max-w-sm border border-accent-100">

    <div class="flex flex-col items-center mb-8">

      <h1 class="text-3xl font-semibold tracking-tight text-gray-800">
        Task<span class="text-blue-400 font-semibold">Pulse</span>
      </h1>

      <p class="text-sm text-slate-400 mt-2 text-center">
        Welcome back — log in to continue
      </p>

    </div>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      class="space-y-5"
    >

      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
          Email
        </label>

        <input
          type="email"
          formControlName="email"
          class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-gray-800 focus:outline-none focus:ring-2 focus:ring-accent-500 focus:border-transparent transition"
        />

        @if (email?.invalid && email?.touched) {
          <p class="text-red-600 text-sm mt-1.5">
            A valid email is required.
          </p>
        }
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
          Password
        </label>

        <input
          type="password"
          formControlName="password"
          class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-gray-800 focus:outline-none focus:ring-2 focus:ring-accent-500 focus:border-transparent transition"
        />

        @if (password?.invalid && password?.touched) {
          <p class="text-red-600 text-sm mt-1.5">
            Password is required.
          </p>
        }
      </div>

      @if (errorMessage()) {
        <p class="text-red-600 text-sm bg-red-50 rounded-lg px-3 py-2">
          {{ errorMessage() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full bg-blue-400 text-white rounded-xl py-3 font-semibold hover:bg-blue-500 active:scale-[0.98] transition disabled:opacity-50 shadow-md shadow-blue-200"
      >
        {{ isLoading() ? 'Logging in...' : 'Log In' }}
      </button>

    </form>
  </div>
</div>
