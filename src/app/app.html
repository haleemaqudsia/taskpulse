@if (authService.isLoggedIn()) {
  <div class="min-h-screen bg-gray-50 flex">

    <!-- Mobile overlay -->
    @if (sidebarOpen()) {
      <div
        class="fixed inset-0 bg-black/40 z-30 lg:hidden"
        (click)="closeSidebar()"
      ></div>
    }

    <!-- Sidebar -->
    <aside
      class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-white border-r border-gray-200
             transform transition-transform duration-200 flex flex-col
             lg:translate-x-0"
      [class.-translate-x-full]="!sidebarOpen()"
      [class.translate-x-0]="sidebarOpen()"
    >
      <div class="h-16 flex items-center px-6 border-b border-gray-200">
        <span class="font-bold text-lg text-gray-800">Task<span class="text-blue-600">Pulse</span></span>
      </div>

      <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
        <a routerLink="/dashboard" routerLinkActive="bg-blue-50 text-blue-700" (click)="closeSidebar()"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100">
          <span>📊</span> Dashboard
        </a>
        <a routerLink="/projects" routerLinkActive="bg-blue-50 text-blue-700" (click)="closeSidebar()"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100">
          <span>📁</span> Projects
        </a>
        <a routerLink="/tasks" routerLinkActive="bg-blue-50 text-blue-700" (click)="closeSidebar()"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100">
          <span>✅</span> My Tasks
        </a>
        <a routerLink="/notifications" routerLinkActive="bg-blue-50 text-blue-700" (click)="closeSidebar()"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100">
          <span>🔔</span> Notifications
        </a>
        <a routerLink="/reports" routerLinkActive="bg-blue-50 text-blue-700" (click)="closeSidebar()"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100">
          <span>📈</span> Reports
        </a>

        @if (isAdmin()) {
          <div class="pt-4 mt-4 border-t border-gray-200">
            <p class="px-3 text-xs font-semibold text-gray-400 uppercase mb-1">Admin</p>
            <a routerLink="/users" routerLinkActive="bg-blue-50 text-blue-700" (click)="closeSidebar()"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100">
              <span>👥</span> Users
            </a>
          </div>
        }
      </nav>

      <div class="px-3 py-4 border-t border-gray-200">
        <button (click)="logout()"
                class="flex items-center gap-3 w-full px-3 py-2.5 rounded-lg text-sm font-medium text-red-600 hover:bg-red-50">
          <span>🚪</span> Logout
        </button>
      </div>
    </aside>

    <!-- Main column -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- Top bar -->
      <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 lg:px-6 flex-shrink-0">
        <button (click)="toggleSidebar()" class="lg:hidden p-2 -ml-2 text-gray-600">
          ☰
        </button>
        <span class="lg:hidden font-bold text-gray-800">Task<span class="text-blue-600">Pulse</span></span>
        <div class="hidden lg:block"></div>
        <div class="flex items-center gap-3">
          <span class="text-sm text-gray-600 hidden sm:inline">{{ authService.currentUser()?.name }}</span>
          <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-semibold">
            {{ authService.currentUser()?.name?.charAt(0) }}
          </div>
        </div>
      </header>

      <!-- Page content -->
      <main class="flex-1 overflow-y-auto">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
} @else {
  <router-outlet></router-outlet>
}

<app-toast></app-toast>
