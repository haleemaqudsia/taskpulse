<div class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 w-[calc(100%-2rem)] max-w-sm">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="rounded-lg shadow-lg px-4 py-3 text-sm font-medium text-white flex items-center justify-between gap-3 animate-in"
      [class.bg-green-600]="toast.type === 'success'"
      [class.bg-red-600]="toast.type === 'error'"
      [class.bg-amber-500]="toast.type === 'warning'"
      [class.bg-gray-800]="toast.type === 'info'"
    >
      <span>{{ toast.message }}</span>
      <button (click)="toastService.dismiss(toast.id)" class="opacity-70 hover:opacity-100">✕</button>
    </div>
  }
</div>
